# roles/kubernetes/tasks/worker.yml
- name: Install K3s on worker nodes
  shell: |
    curl -sfL https://get.k3s.io | \
    K3S_URL=https://{{ master_node }}:6443 \
    K3S_TOKEN={{ k3s_token }} \
    INSTALL_K3S_VERSION={{ k3s_version }} \
    sh -
  when: inventory_hostname in worker_nodes
  tags: [k3s, workers]
