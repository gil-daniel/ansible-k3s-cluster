---
# Check if Node Exporter is already installed
- name: Check if Node Exporter is already installed
  ansible.builtin.stat:
    path: "/opt/node_exporter-1.9.1.linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}/node_exporter"
  register: node_exporter_binary

# Download Node Exporter for ARM64 if not installed
- name: Download Node Exporter for ARM64
  ansible.builtin.get_url:
    url: https://github.com/prometheus/node_exporter/releases/download/v1.9.1/node_exporter-1.9.1.linux-arm64.tar.gz
    dest: /tmp/node_exporter.tar.gz
  when:
    - ansible_architecture == "aarch64"
    - not node_exporter_binary.stat.exists

# Download Node Exporter for AMD64 if not installed
- name: Download Node Exporter for AMD64
  ansible.builtin.get_url:
    url: https://github.com/prometheus/node_exporter/releases/download/v1.9.1/node_exporter-1.9.1.linux-amd64.tar.gz
    dest: /tmp/node_exporter.tar.gz
  when:
    - ansible_architecture == "x86_64"
    - not node_exporter_binary.stat.exists

# Extract Node Exporter archive if not installed
- name: Extract Node Exporter archive
  ansible.builtin.unarchive:
    src: /tmp/node_exporter.tar.gz
    dest: /opt/
    remote_src: yes
  when: not node_exporter_binary.stat.exists

# Set correct directory name based on architecture
- name: Set Node Exporter directory name
  ansible.builtin.set_fact:
    node_exporter_dir: "node_exporter-1.9.1.linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Create node_exporter system user
  ansible.builtin.user:
    name: node_exporter
    shell: /usr/sbin/nologin
    system: yes
    create_home: no

- name: Ensure node_exporter binary is executable
  ansible.builtin.file:
    path: "/opt/{{ node_exporter_dir }}/node_exporter"
    mode: '0755'
    owner: node_exporter
    group: node_exporter

- name: Create systemd unit file for Node Exporter
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      After=network.target

      [Service]
      User=node_exporter
      ExecStart=/opt/{{ node_exporter_dir }}/node_exporter --web.listen-address=0.0.0.0:9100
      Restart=always

      [Install]
      WantedBy=multi-user.target
    mode: '0644'

- name: Enable and start Node Exporter service
  ansible.builtin.systemd:
    name: node_exporter
    enabled: yes
    state: started
    daemon_reload: yes
